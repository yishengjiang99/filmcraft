# Web build artifact: `cargo xtask web` (wasm32 + wasm-bindgen) uploaded as `filmcraft-web-dist`, plus the
# Media Browser engine tests and the UI menu tests. Used to deploy grepawk.com/filmcraft when no local
# wasm toolchain is at hand (scripts/deploy-grepawk.sh --skip-build after unpacking it into target/web/dist).
name: Web dist

on:
  pull_request:
    paths: [apps/filmcraft-web/**, crates/ui-egui/**, crates/engine/**, .github/workflows/web-dist.yml]
  push:
    branches: [main]
    paths: [apps/filmcraft-web/**, crates/ui-egui/**, crates/engine/**, .github/workflows/web-dist.yml]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: web-dist-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: web-dist-${{ runner.os }}-
      - name: wasm-bindgen CLI
        run: |
          v=$(grep -oP 'const WASM_BINDGEN: &str = "\K[^"]+' xtask/src/main.rs)
          (wasm-bindgen --version 2>/dev/null | grep -q " $v$") || cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Engine tests (Media Browser)
        run: cargo test -p filmcraft-engine media_browser
      - name: Build web
        run: cargo xtask web
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-web-dist
          path: target/web/dist
          retention-days: 14
